<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opdracht: RGB naar Hex converteren (***)</title>
  </head>
  <body>
    <form id="myForm">
      R: <input type="text" id="kleurRIn" maxlength="3" size="3" /> G:
      <input type="text" id="kleurGIn" maxlength="3" size="3" /> B:
      <input type="text" id="kleurBIn" maxlength="3" size="3" />
      <input type="button" id="bereken" value="Bereken de kleur" />
      <input type="text" id="hexWaardeOut" />
    </form>

    <script>
      "use strict";

      // DOMCONTENTLOADED.
      window.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("bereken")
          .addEventListener("click", berekenKleur);
      });

      // OBJECT CONSTRUCTOR KLEURHEX(3 KLEUREN + HEXSTRING METHOD).
      function KleurHex(rood, groen, blauw) {
        this.rood = rood;
        this.groen = groen;
        this.blauw = blauw;

        this.hexString = function () {
          let roodHex = hexadecimaalTransformeren(this.rood);
          let groenHex = hexadecimaalTransformeren(this.groen);
          let blauwHex = hexadecimaalTransformeren(this.blauw);
          // RETURN ALS STRING
          return `#${roodHex}${groenHex}${blauwHex}`;
        };
      }

      // FUNCTIE HEXADECIMAAL TRANSFORMEREN() EN 1-DIGIT-CONTROLE.
      function hexadecimaalTransformeren(kleurCode) {
        // ROND AF NAAR BENEDEN + TOSTRING FUNCTIE(16) + HOOFDLETTERS
        let hex = Math.floor(kleurCode).toString(16).toUpperCase();
        return hex.length === 1 ? "0" + hex : hex;
      }

      // FUNCTIE BEREKENKLEUR().
      function berekenKleur() {
        let rood = parseInt(document.getElementById("kleurRIn").value) || 0;
        let groen = parseInt(document.getElementById("kleurGIn").value) || 0;
        let blauw = parseInt(document.getElementById("kleurBIn").value) || 0;

        // MAAK NIEUWE KLEURHEX-OBJECT AAN; NAAM = MIJNKLEURHEX.
        let mijnKleurHex = new KleurHex(rood, groen, blauw);

        // TOON DE HEX-WAARDE.
        document.getElementById("hexWaardeOut").value =
          mijnKleurHex.hexString();
        document.body.style.backgroundColor = mijnKleurHex.hexString();
      }
    </script>
  </body>
</html>
