<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      "use strict";
      let favorieteFilm = {
        titel: "Puff the Magic Dragon",
        duur: 30,
        sterren: ["Puff", "Jackie", "Living Sneezes"],
      };

      console.log(
        `Mijn favoriete film ${favorieteFilm.titel} duurt ${favorieteFilm.duur} minuten en de sterren van de film zijn:`
      );

      let lengte = favorieteFilm.sterren.length;
      for (let i = 0; i < lengte; i++) {
        console.log(favorieteFilm.sterren[i]);
      }
    </script>
  </body>
