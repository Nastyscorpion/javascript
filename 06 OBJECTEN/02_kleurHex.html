<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body {
        height: 100%;
      }
      #hex {
        color: white;
        font: 64px/64px Verdana;
        height: 64px;
        position: relative;
        top: 50%;
        margin-top: -32px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="hex"></div>
    <input id="myBtn" type="button" value="Toon de kleurtijd" />

    <script>
      let datum, uur, min, sec, color, docBody, hex;

      window.addEventListener("DOMContentLoaded", function () {
        // Initialiseer de variabelen
        docBody = document.body;
        hex = document.getElementById("hex");

        // Voeg de event listener toe
        document.getElementById("myBtn").addEventListener("click", displayTime);
      });

      function displayTime() {
        datum = new Date(); // Nieuwe datumobject
        uur = datum.getHours();
        min = datum.getMinutes();
        sec = datum.getSeconds();

        // Controleer of de tijden slechts 1 digit bevatten
        uur = checkSingle(uur);
        min = checkSingle(min);
        sec = checkSingle(sec);

        // Maak een kleurcode van de tijd
        color = "#" + uur + min + sec;

        // Stel de achtergrondkleur in
        docBody.style.backgroundColor = color;

        // Stel de HEX-waarde in op het scherm
        hex.innerHTML = color;

        // Roep dezelfde functie opnieuw aan na 1 seconde
        setTimeout(displayTime, 1000);
      }

      function checkSingle(time) {
        if (time <= 9) {
          time = `0${time}`;
        }
        return time;
      }
    </script>
  </body>
</html>
