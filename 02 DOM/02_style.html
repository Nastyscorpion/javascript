<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .groen {
        color: green;
      }
    </style>
  </head>
  <body>
    <p id="info" class="vet, groen">Hier vind je alle informatie over mij.</p>
    <script>
      let kleur2 = window.getComputedStyle(
        document.getElementById("info")
      ).color;
      console.log(`kleur2: ${kleur2}`);
    </script>
  </body>
</html>
