<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      "use strict";
      let semester1 = ["Januari", "Februari", "Maart", "April", "Mei", "Juni"];
      let semester2 = [
        "Juli",
        "Augustus",
        "September",
        "Oktober",
        "November",
        "December",
      ];

      let totaleJaar = semester1.concat(semester2);
      console.log(totaleJaar);

      function maandenVerkorten(afgekort, langeNaam) {
        console.log(`Afgekort tot nu: ${afgekort}`);
        console.log(`langeNaam: ${langeNaam}`);
        return afgekort.concat(langeNaam.substring(0, 3));
      }

      let afgekorteMaanden = totaleJaar.reduce(maandenVerkorten, []);
      console.log(afgekorteMaanden);
    </script>
  </body>
</html>
