<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let getallen = [10, 20, 30, 40, 50];

      function filterGroterDanGemiddelde(getallen) {
        const gemiddelde =
          getallen.reduce((som, getal) => som + getal, 0) / getallen.length;

        return getallen.filter((getal) => getal > gemiddelde);
      }
    </script>
  </body>
</html>
