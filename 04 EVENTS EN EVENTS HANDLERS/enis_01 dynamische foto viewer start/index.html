<!DOCTYPE html>
<html>
  <head>
    <title>Image gallery</title>
    <link rel="stylesheet" type="text/css" href="gallery.css" />
  </head>

  <body>
    <p><img id="largeImg" src="550x400/ipad.jpg" alt="Large image" /></p>
    <div id="thumbs">
      <a href="550x400/ipad.jpg" title="ipad"><img src="200x150/ipad.jpg" /></a>
    </div>

    <script>
      // DOMContentLoaded event
      document.addEventListener("DOMContentLoaded", function () {
        let largeImg = document.getElementById("largeImg");

        let bestandsnamen = [
          "550x400/ipad.jpg",
          "550x400/dj.jpg",
          "550x400/ubuntu.jpg",
          "550x400/electronica.jpg",
        ];

        let teller = 1;

        let nextButton = document.createElement("button");
        nextButton.id = "nextButton";
        nextButton.textContent = "Add Image";
        document.body.appendChild(nextButton);

        nextButton.addEventListener("click", function () {
          teller++;
          if (teller >= bestandsnamen.length) {
            teller = 1;
          }

          largeImg.src = bestandsnamen[teller];

          let nieuweLink = document.createElement("a");
          let nieuweImg = document.createElement("img");
          nieuweImg.src = bestandsnamen[teller];
          nieuweLink.appendChild(nieuweImg);
          document.getElementById("thumbs").appendChild(nieuweLink);
        });
      });
    </script>
  </body>
</html>
