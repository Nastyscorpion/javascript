<!DOCTYPE html>
<html>
  <head>
    <title>Image gallery</title>
    <link rel="stylesheet" type="text/css" href="gallery.css" />
  </head>

  <body>
    <p><img id="largeImg" src="550x400/ipad.jpg" alt="Large image" /></p>
    <div id="thumbs">
      <a href="550x400/ipad.jpg" title="ipad"><img src="200x150/ipad.jpg" /></a>
    </div>

    <script>
      "use strict";
      // DOMContentLoaded.
      document.addEventListener("DOMContentLoaded", function () {
        // Variabelen
        let largeImg = document.getElementById("largeImg");
        let thumbnails = document.getElementById("thumbs");
        let bestandsnamen = [
          "ipad.jpg",
          "dj.jpg",
          "ubuntu.jpg",
          "electronica.jpg",
        ];
        // Teller die niet bij 0 begint.
        let teller = 1;

        // Buttonknop als variabele definiëren.
        let buttonAanmaken = document.createElement("button");
        buttonAanmaken.id = "buttonAanmaken";
        buttonAanmaken.textContent = "Voeg afbeelding toe";

        // Voeg Buttonknop toe en wees aan als child van Thumbnails.
        thumbnails.appendChild(buttonAanmaken);

        // Nieuwe afbeelding toevoegen wanneer men klikt.
        buttonAanmaken.addEventListener("click", function () {
          if (teller < bestandsnamen.length) {
            let item = bestandsnamen[teller];
            let a = document.createElement("a");
            a.href = `550x400/${item}`;
            // Bestandsnamen zonder extensie.
            a.title = item.slice(0, -4);

            let img = document.createElement("img");
            img.src = `200x150/${item}`;
            // Bestandsnamen zonder extensie.
            img.alt = item.slice(0, -4);

            a.appendChild(img);
            thumbnails.insertBefore(a, buttonAanmaken);
            // Verhoog teller met 1.
            teller++;
          } else {
            alert("Geen afbeeldingen meer beschikbaar!");
          }
        });

        // Grote afbeelding wordt aangepast wanneer men op de kleine afb klikt.
        thumbnails.addEventListener("click", function (e) {
          if (e.target.tagName === "IMG") {
            largeImg.src = e.target.parentElement.href;
            e.preventDefault();
          }
        });
      });
    </script>
  </body>
</html>
